<!DOCTYPE html>
<html>
  <head>
    <title>蜂巢·監控服務</title>
    <link rel="icon" href="https://cdn.jsdmirror.com/gh/iTCoffe/Status@main/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="index.css" />
    <style>
      /* 主题切换按钮样式 */
      .theme-switcher {
        position: fixed; top: 20px; right: 20px; display: flex;
        background: rgba(255,255,255,0.8); border-radius: 24px; padding: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1000;
      }
      .dark-theme .theme-switcher { background: rgba(0,0,0,0.8); }
      .theme-btn {
        background: none; border: none; cursor: pointer; padding: 8px 12px;
        margin: 0 2px; border-radius: 50%; transition: all 0.3s ease;
        font-size: 20px; line-height: 1;
      }
      .theme-btn:hover { background-color: rgba(0,0,0,0.1); transform: scale(1.1); }
      .theme-btn.active { background-color: rgba(0,0,0,0.2); }

      /* 弹窗定位修正：确保不会被鼠标遮挡 */
      #tooltip { position: absolute; pointer-events: none; z-index: 10000; }
    </style>
    <script src="index.js"></script>
  </head>
  <body>
    <div class="theme-switcher">
      <button class="theme-btn active" data-theme="light" title="浅色模式">☀️</button>
      <button class="theme-btn" data-theme="dark" title="深色模式">🌙</button>
    </div>

    <div class="pageContainer">
      <div class="headline">
        <img src="logo.png" alt="Logo" width="200px" />
        <span> 監控服務 </span>
      </div>
      <div id="reports" class="reportContainer"></div>
      
      <div class="footer" style="text-align: center; margin-top: 20px; padding: 20px; font-size: 14px; opacity: 0.6;">
        <span id="copyrightLink"></span>
      </div>

      <div id="tooltip" class="tooltip" style="opacity: 0">
        <div id="tooltipArrow" class="tooltipArrow"></div>
        <div id="tooltipDateTime" class="tooltipDateTime"></div>
        <div id="tooltipStatus" class="tooltipStatus"></div>
        <hr />
        <div id="tooltipDescription" class="tooltipDescription"></div>
      </div>
      <div id="templates" style="display: none">
        <div id="statusSquareTemplate" class="statusSquare $color" data-status="$color"></div>
        <div id="statusLineTemplate" class="statusLine"></div>
        <div id="statusStreamContainerTemplate" class="statusStreamContainer"></div>
        <div id="statusContainerTemplate" class="statusContainer">
          <div class="statusHeader">
            <h6 class="statusTitle">$title&nbsp;</h6>
            <div class="$color statusHeadline">$status</div>
          </div>
          <div class="statusSubtitle">
            <div class="sectionUrl"><a href="$url">$url</a></div>
            <div class="statusUptime">最近 30 天上线率 $upTime</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 1. 主题切换
      function setupThemeSwitcher() {
        const themeBtns = document.querySelectorAll('.theme-btn');
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');
        document.body.classList.add(initialTheme === 'dark' ? 'dark-theme' : 'light-theme');
        themeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.theme === initialTheme));
        themeBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            const selectedTheme = btn.dataset.theme;
            document.body.classList.remove('light-theme', 'dark-theme');
            document.body.classList.add(selectedTheme === 'dark' ? 'dark-theme' : 'light-theme');
            themeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            localStorage.setItem('theme', selectedTheme);
          });
        });
      }

      // 2. 更新版权年份
      function updateCopyrightYear() {
        const startYear = 2022;
        const currentYear = new Date().getFullYear();
        const copyrightElem = document.getElementById('copyrightLink');
        if (copyrightElem) {
          const yearDisplay = currentYear > startYear ? `${startYear}-${currentYear}` : startYear;
          copyrightElem.textContent = `© ${yearDisplay} 蜂巢·隱曜`;
        }
      }
      
      // 3. 修复弹窗位置 (固定在方格下方居中)
      function fixTooltipPosition() {
        const tooltip = document.getElementById('tooltip');
        document.addEventListener('mouseover', (e) => {
          if (e.target.classList.contains('statusSquare')) {
            const rect = e.target.getBoundingClientRect();
            requestAnimationFrame(() => {
              const tooltipWidth = tooltip.offsetWidth;
              let finalLeft = (rect.left + window.scrollX + rect.width / 2) - (tooltipWidth / 2);
              const padding = 10;
              if (finalLeft + tooltipWidth > window.innerWidth + window.scrollX - padding) {
                finalLeft = window.innerWidth + window.scrollX - tooltipWidth - padding;
              }
              if (finalLeft < window.scrollX + padding) finalLeft = window.scrollX + padding;
              tooltip.style.left = finalLeft + 'px';
              tooltip.style.top = (rect.bottom + window.scrollY + 10) + 'px';
            });
          }
        }, true);
      }

      // 4. 内容翻译器 + 网址伪装
      function setupContentModifier() {
        const dictionary = {
          'Fully Operational': '系统运行正常',
          'Operational': '运行正常',
          'Degraded Performance': '性能下降',
          'Partial Outage': '部分故障',
          'Major Outage': '严重故障',
          'Maintenance': '维护中',
          'No Data Available': '暂无可用数据',
          'No data': '暂无数据',
          'Up': '在线',
          'Down': '离线'
        };

        // 【网址伪装配置表】
        // 键名：你在 urls.cfg 中定义的显示标题（Title）
        // 键值：你想要显示的伪装网址
        const urlMap = {
          '蜂巢·樂玩公社㊙️': 'https://vlink.cc/5iclub',
          '“閒”是生活的標點': 'https://loong.ifanr.pp.ua',
          'ADS拦截规则·CHINESE': 'https://adrules.ifanr.pp.ua',
          'GKD規則·CHINESE': 'https://icloud.ifanr.pp.ua',
          'iTV·實時直播集萃🌟': 'https://itv.ifanr.pp.ua',
          '臨時信箱·便捷隨心': 'https://email.ifanr.pp.ua',
          'Docker·離線映像下載器': 'https://docker.ifanr.pp.ua',
          'GitHub-文件加速·公益服務': 'https://github.ifanr.pp.ua',
          '簡約·鏈結縮短服務': 'https://url.ifanr.pp.ua',
          '跟着教员走遍中国·毛主席足迹地图': 'https://mmap.ifanr.pp.ua',
          '無意義·摸魚掃碼': 'https://loong.ifanr.pp.ua/genact',
          '紅色警戒·全平台即時戰': 'https://ra2web.ifanr.pp.ua',
          '寶可夢·自走棋': 'https://pokemon-auto-chess.ifanr.pp.ua',
          'Blogspot·博客📛': 'https://5iclub.blogspot.com',
          '計畫通行·監控服務🛎': 'https://status.ifanr.pp.ua' // 没匹配到时的默认地址
        };

        const modifyElement = (node) => {
          if (node.nodeType === 3) { // 文本节点
            const text = node.textContent.trim();
            if (dictionary[text]) node.textContent = dictionary[text];
            return;
          }

          if (node.nodeType === 1) { // 元素节点
            // A. 处理翻译
            const text = node.textContent.trim();
            if (dictionary[text]) {
                // 如果是弹窗内容，直接修改
                if (node.id === 'tooltipStatus' || node.classList.contains('statusHeadline')) {
                    node.textContent = dictionary[text];
                }
            }

            // B. 处理网址伪装
            if (node.classList.contains('statusContainer')) {
                const titleEl = node.querySelector('.statusTitle');
                const urlLink = node.querySelector('.sectionUrl a');
                if (titleEl && urlLink) {
                    const maskedUrl = urlMap[titleEl.textContent.trim()] || urlMap['Default'];
                    urlLink.textContent = maskedUrl;
                    urlLink.href = "javascript:void(0);";
                }
            }
            
            // 递归子节点
            node.childNodes.forEach(modifyElement);
          }
        };

        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            // 监听节点添加
            mutation.addedNodes.forEach(modifyElement);
            // 监听文本变化（用于弹窗内容更新）
            if (mutation.type === 'characterData' || (mutation.target.id === 'tooltipStatus')) {
                const text = mutation.target.textContent.trim();
                if (dictionary[text]) mutation.target.textContent = dictionary[text];
            }
          });
        });

        observer.observe(document.body, { 
            childList: true, 
            subtree: true, 
            characterData: true 
        });
      }

      // 初始化
      document.addEventListener('DOMContentLoaded', () => {
        setupThemeSwitcher();
        updateCopyrightYear();
        fixTooltipPosition();
        setupContentModifier();
        genAllReports();
      });
    </script>
  </body>
</html>
